# Publishes the Docker image to GitHub Container Registry (ghcr.io) on every
# push to main, so people can run the dashboard without cloning or building.
#
#   docker pull ghcr.io/sebggph/claude-dashboard:latest
#
# Tags: "latest" (main), the short commit SHA, and the version from a git tag
# like v0.4.0 (when you push one).
name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Claude Context Dashboard
            org.opencontainers.image.description=See how much context your Claude Code sessions use, what fills it, and how to keep it lean.
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64 # Intel/AMD PCs and Apple Silicon Macs
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
