# Checks every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1' # Mondays: also check that external doc links still work
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test, content check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Parser tests
        run: npm test
      - name: Content check (translations, guides, data)
        run: npm run check -- --offline
      - name: Build
        run: npm run build

  links:
    name: External links & new docs pages
    # Network checks can be flaky, so they run weekly and on demand, not on every PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
