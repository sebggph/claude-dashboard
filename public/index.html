<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Context Dashboard</title>
  <meta name="description" content="See how much context your Claude Code sessions use, what fills it, and how to keep it lean.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c96442'/%3E%3Cpath d='M8 22h4v-6H8zm6 0h4V10h-4zm6 0h4v-9h-4z' fill='white'/%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem('ccd.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Claude Context Dashboard">
        <span class="brand-mark"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M5 19h3v-6H5zm5.5 0h3V6h-3zm5.5 0h3v-9h-3z"/></svg></span>
        <span>Context Dashboard</span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="tools">
        <div class="seg" id="lang" role="group" aria-label="Language"></div>
        <button class="icon-btn" id="theme-btn" type="button"></button>
        <button class="icon-btn" id="settings-btn" type="button" aria-haspopup="true" aria-expanded="false"></button>
      </div>
    </div>
    <div class="settings-pop" id="settings" hidden></div>
  </header>

  <main id="app" tabindex="-1"></main>
  <footer id="footer"></footer>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true"></aside>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
